
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryAI - Groq AI Story Generator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0c0b16;
    color: white;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 850px;
    margin: 35px auto;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 45px;
    margin-bottom: 10px;
}

h1 {
    font-size: 36px;
    background: linear-gradient(90deg,#c084fc,#818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

header p {
    color: #aaa;
    margin-top: 12px;
    line-height: 1.7;
}

.panel, .result {
    background: #191727;
    border: 1px solid #343049;
    padding: 25px;
    border-radius: 16px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 17px 0 9px;
    font-weight: bold;
    color: #ddd;
}

textarea, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #39364d;
    border-radius: 9px;
    background: #100f1c;
    color: white;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

textarea:focus, select:focus {
    border-color: #a78bfa;
}

button {
    border: none;
    background: #8b5cf6;
    color: white;
    padding: 14px 20px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    background: #7c3aed;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.generate {
    width: 100%;
    margin-top: 24px;
    font-size: 16px;
}

.status {
    text-align: center;
    color: #c4b5fd;
    margin-top: 18px;
    line-height: 1.6;
}

.result {
    display: none;
}

.result h2 {
    color: #c4b5fd;
    margin-bottom: 20px;
}

#story {
    white-space: pre-wrap;
    line-height: 1.9;
    color: #e5e1f0;
    font-size: 16px;
    overflow-wrap: anywhere;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.actions button {
    flex: 1;
    min-width: 120px;
}

footer {
    text-align: center;
    color: #777;
    padding: 20px;
    font-size: 13px;
}

@media(max-width:600px) {
    body { padding: 13px; }
    h1 { font-size: 29px; }
    .panel, .result { padding: 18px; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">✨</div>
    <h1>StoryAI Generator</h1>
    <p>
        Your imagination. Our AI. Unlimited possibilities.<br>
        Create amazing stories with Groq AI.
    </p>
</header>

<section class="panel">

    <label for="topic">💡 Story Idea</label>

    <textarea
        id="topic"
        maxlength="1000"
        placeholder="Example: A young boy discovers a magical kingdom..."
    ></textarea>

    <label for="genre">📚 Choose Genre</label>

    <select id="genre">
        <option>Fantasy</option>
        <option>Horror</option>
        <option>Romance</option>
        <option>Adventure</option>
        <option>Science Fiction</option>
        <option>Mystery</option>
        <option>Comedy</option>
        <option>Thriller</option>
        <option>Moral Story</option>
        <option>Children Story</option>
    </select>

    <label for="length">📖 Story Length</label>

    <select id="length">
        <option value="short">Short (300 words)</option>
        <option value="medium" selected>Medium (700 words)</option>
        <option value="long">Long (1200 words)</option>
    </select>

    <button class="generate" id="generateBtn">
        ✨ Generate My Story
    </button>

    <div class="status" id="status" role="status"></div>

</section>

<section class="result" id="result">

    <h2>📖 Your AI Generated Story</h2>

    <div id="story"></div>

    <div class="actions">
        <button id="copyBtn">📋 Copy Story</button>
        <button id="downloadBtn">⬇ Download</button>
        <button id="againBtn">🔄 Regenerate</button>
    </div>

</section>

<footer>
    Powered by Groq AI ⚡
</footer>

</div>

<script>

// Groq backend API endpoint
const API_URL = "/api/generate";

const topicInput = document.getElementById("topic");
const genreInput = document.getElementById("genre");
const lengthInput = document.getElementById("length");

const generateBtn = document.getElementById("generateBtn");
const statusText = document.getElementById("status");

const result = document.getElementById("result");
const storyBox = document.getElementById("story");


// GENERATE STORY

async function generateStory() {

    const topic = topicInput.value.trim();

    if (!topic) {
        statusText.textContent =
            "❌ Please enter your Story Idea!";
        topicInput.focus();
        return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = "⏳ Generating Story...";

    statusText.textContent =
        "⚡ Groq AI is writing your story...";

    result.style.display = "none";

    try {

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                topic: topic,
                genre: genreInput.value,
                length: lengthInput.value
            })
        });

        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error(
                "Invalid API response. Check backend URL."
            );
        }

        if (!response.ok) {
            throw new Error(
                data.error || "Story generation failed."
            );
        }

        if (!data.story) {
            throw new Error("No story received from AI.");
        }

        storyBox.textContent = data.story;
        result.style.display = "block";

        statusText.textContent =
            "✅ Your story is ready!";

        result.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "❌ " + error.message;

    } finally {

        generateBtn.disabled = false;

        generateBtn.textContent =
            "✨ Generate My Story";

    }
}


// BUTTON EVENTS

generateBtn.addEventListener("click", generateStory);

document.getElementById("againBtn")
.addEventListener("click", generateStory);


// COPY STORY

document.getElementById("copyBtn")
.addEventListener("click", async function() {

    try {

        await navigator.clipboard.writeText(
            storyBox.textContent
        );

        statusText.textContent =
            "✅ Story copied successfully!";

    } catch {

        statusText.textContent =
            "❌ Unable to copy story.";

    }

});


// DOWNLOAD STORY

document.getElementById("downloadBtn")
.addEventListener("click", function() {

    const blob = new Blob(
        [storyBox.textContent],
        {type: "text/plain;charset=utf-8"}
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "StoryAI-Story.txt";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);

    statusText.textContent =
        "✅ Story downloaded successfully!";

});

</script>

</body>
</html>
